<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9ecd9">
<title>Lalaangan — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/collection.css">
<link rel="stylesheet" href="css/slide.css">
<link rel="stylesheet" href="css/status.css">
<link rel="stylesheet" href="css/navbar.css">
</head>
<body data-page="collection">

<div class="shell">

  <main class="screen" data-slide>

    <header class="hd">
      <div class="status">
        <button class="status__lv" type="button" aria-label="Profile" data-tab="profile">
          <span>👤</span>
          <span class="status__badge" data-status="level"></span>
        </button>
        <div class="status__streak"><span>🔥</span> <span data-status="streak"></span></div>
      </div>

      <div class="hd-top">
        <h1>Collection</h1>
        <span class="count" id="count">0 / 0</span>
      </div>


      <div class="chips-row">
        <div class="chips" id="chips">
          <button type="button" data-filter="all" class="on">All</button>
          <button type="button" data-filter="found">Discovered</button>
          <button type="button" data-filter="locked">Locked</button>
        </div>
        <button type="button" class="filter-btn" id="filter-btn" aria-expanded="false" aria-controls="filter-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filter<span class="filter-count" id="filter-count" hidden></span>
        </button>
      </div>

      <!-- Region and rarity options are filled in by collection.js -->
      <div class="filter-panel" id="filter-panel" hidden></div>
    </header>

    <div class="grid" id="grid"></div>

  </main>

  <nav class="nav" aria-label="Main">
    <a href="home.html#home" class="nav-item" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H3l9-9 9 9h-2M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6h6v6"/></svg>
      <span>Home</span>
    </a>
    <a href="collection.html" class="nav-item is-on" aria-current="page" data-tab="collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19a2 2 0 0 1 2-2h14V4H5a2 2 0 0 0-2 2v13z"/><path d="M19 17v4H5a2 2 0 0 1 0-4"/><path d="M9 7h6"/></svg>
      <span>Collection</span>
    </a>
    <a href="map.html" class="nav-item" data-tab="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg>
      <span>Map</span>
    </a>
    <a href="quests.html" class="nav-item" data-tab="quests">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
      <span>Quests</span>
    </a>
    <a href="profile.html" class="nav-item" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <div class="overlay" id="overlay" data-close></div>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Creature details"></section>

</div>

<script src="js/nav.js"></script>
<script src="js/sfx.js"></script>
<script src="js/music.js"></script>
<script src="js/status.js"></script>
<script src="js/collection.js"></script>
</body>
</html>
