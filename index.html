<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lalaangan</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
    /* The screens (Home, Collection, Map, Quests, Profile) load in this frame.
       This outer page never reloads, so the music keeps playing between screens. */
    .app-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    /* the next screen loads hidden, then replaces the old one (js/shell.js) */
    .app-frame.is-loading { visibility: hidden; }
  </style>
</head>
<body>
  <iframe id="app" class="app-frame" src="home.html" title="Lalaangan"
          allow="geolocation; accelerometer; gyroscope; magnetometer; fullscreen"></iframe>

  <!-- Background music lives here (see js/music.js); screen swapping in js/shell.js -->
  <script src="js/music.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
