<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lalaangan Community Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/navbar.css">
</head>
<body data-page="map">
<div class="app" id="app">
  <canvas id="map" aria-label="Map of Kuala Penyu"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="creature" id="creature" aria-hidden="true">
    <svg viewBox="0 0 64 72" class="sprite">
      <ellipse class="shadow" cx="32" cy="68" rx="15" ry="3.5"/>
      <g class="legs">
        <rect class="leg leg-l" x="22" y="53" width="8" height="14" rx="4"/>
        <rect class="leg leg-r" x="34" y="53" width="8" height="14" rx="4"/>
      </g>
      <g class="bod">
        <path class="sprout" d="M32 15 C31 7 25 3 19 5 C23 9 27 12 32 15 Z"/>
        <rect class="arm arm-l" x="6" y="33" width="12" height="7" rx="3.5"/>
        <rect class="arm arm-r" x="46" y="33" width="12" height="7" rx="3.5"/>
        <rect class="body" x="14" y="14" width="36" height="44" rx="16"/>
        <circle class="eye" cx="26" cy="31" r="3.2"/>
        <circle class="eye" cx="38" cy="31" r="3.2"/>
        <circle class="belly" cx="32" cy="45" r="5"/>
      </g>
    </svg>
  </div>

  <header class="hud-top">
    <div class="filters" role="tablist" aria-label="Show on map">
      <button class="chip" data-filter="all" aria-pressed="true" type="button">All</button>
      <button class="chip" data-filter="creature" aria-pressed="false" type="button"><i class="dot dot-creature"></i>Creatures</button>
      <button class="chip" data-filter="landmark" aria-pressed="false" type="button"><i class="dot dot-landmark"></i>Community</button>
      <button class="chip" data-filter="health" aria-pressed="false" type="button"><i class="dot dot-health"></i>Health</button>
    </div>
    <button class="level" id="level" type="button" aria-label="Level 7">
      <span>LV</span><b>7</b>
    </button>
  </header>

  <div class="zoom" role="group" aria-label="Map zoom">
    <button class="zoom-btn" id="zoomIn" type="button" aria-label="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="zoom-track" aria-hidden="true"><div class="zoom-level" id="zoomLevel"></div></div>
    <button class="zoom-btn" id="zoomOut" type="button" aria-label="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
  </div>

  <div class="compass" aria-hidden="true">
    <svg viewBox="0 0 40 40"><path class="n" d="M20 5 L25 20 L20 18 L15 20 Z"/><path class="s" d="M20 35 L15 20 L20 22 L25 20 Z"/></svg>
    <span>N</span>
  </div>

  <div class="stick" id="stick" aria-label="Joystick: drag to walk">
    <div class="ring"></div>
    <div class="knob" id="knob"></div>
  </div>

  <section class="quest" id="quest" aria-label="Today's walk">
    <div class="stat"><b id="steps">2,341</b><span>Steps</span></div>
    <div class="stat"><b id="km">1.76</b><span>Km</span></div>
    <div class="stat"><b id="found">0</b><span>Found</span></div>
    <span class="demo" id="modePill"><i></i>Demo</span>
  </section>
  <section class="sheet" id="sheet" hidden aria-live="polite">
    <button class="close" id="sheetClose" type="button" aria-label="Close">×</button>
    <span class="tag" id="sTag">SDG 11 · Community</span>
    <h2 id="sTitle">Kuala Penyu Jetty</h2>
    <p id="sText"></p>
    <div class="sheet-foot">
      <span class="meta" id="sDist">≈ 120 m away</span>
      <button class="primary" id="sBtn" type="button">Check in</button>
    </div>
  </section>

  <nav class="nav" aria-label="Main">
    <a href="home.html#home" class="nav-item" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H3l9-9 9 9h-2M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6h6v6"/></svg>
      <span>Home</span>
    </a>
    <a href="collection.html" class="nav-item" data-tab="collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19a2 2 0 0 1 2-2h14V4H5a2 2 0 0 0-2 2v13z"/><path d="M19 17v4H5a2 2 0 0 1 0-4"/><path d="M9 7h6"/></svg>
      <span>Collection</span>
    </a>
    <a href="map.html" class="nav-item is-on" aria-current="page" data-tab="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg>
      <span>Map</span>
    </a>
    <a href="quests.html" class="nav-item" data-tab="quests">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
      <span>Quests</span>
    </a>
    <a href="profile.html" class="nav-item" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="js/nav.js"></script>
<script src="js/sfx.js"></script>
<script src="js/music.js"></script>
<script src="js/activity.js"></script>
<script src="js/map.js"></script>
</body>
</html>
